<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1510 663" width="1510" height="663" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
<title id="title">Let a line counter read a pipeline</title><desc id="desc">Teaching proposal. The input router opens a named file or borrows standard input for a dash. Three checks verify pipeline counts, named-file counts and continued caller ownership of standard input. Gray means context, blue means changed and green means new.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#435970"/></marker></defs>
<rect width="1510" height="663" fill="white"/>
<text x="28" y="43" font-size="29" font-weight="700" fill="#182f46" text-anchor="start">Let a line counter read a pipeline</text>
<rect x="1285" y="20" width="70" height="23" rx="4" fill="#a3a3a3"/>
<text x="1320.0" y="36" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">context</text>
<rect x="1363" y="20" width="75" height="23" rx="4" fill="#3b82f6"/>
<text x="1400.5" y="36" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">changed</text>
<rect x="1446" y="20" width="45" height="23" rx="4" fill="#22a06b"/>
<text x="1468.5" y="36" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">new</text>
<text x="28" y="75" font-size="17" font-weight="400" fill="#182f46" text-anchor="start">Proposed CLI change   •   The input router borrows standard input for a dash and opens a file for a path.</text>
<rect x="16" y="108" width="241" height="529" rx="5" fill="#eff4f8"/>
<text x="29" y="138" font-size="17" font-weight="700" fill="#182f46" text-anchor="start">Domain</text>
<rect x="265" y="108" width="241" height="529" rx="5" fill="#f5f7fa"/>
<text x="278" y="138" font-size="17" font-weight="700" fill="#182f46" text-anchor="start">Architecture</text>
<rect x="514" y="108" width="241" height="529" rx="5" fill="#eff4f8"/>
<text x="527" y="138" font-size="17" font-weight="700" fill="#182f46" text-anchor="start">Subsystem Design</text>
<rect x="763" y="108" width="241" height="529" rx="5" fill="#f5f7fa"/>
<text x="776" y="138" font-size="17" font-weight="700" fill="#182f46" text-anchor="start">Subsystem Interfaces</text>
<rect x="1012" y="108" width="241" height="529" rx="5" fill="#eff4f8"/>
<text x="1025" y="138" font-size="17" font-weight="700" fill="#182f46" text-anchor="start">State Management</text>
<rect x="1261" y="108" width="241" height="529" rx="5" fill="#f5f7fa"/>
<text x="1274" y="138" font-size="17" font-weight="700" fill="#182f46" text-anchor="start">Verification</text>
<rect x="25" y="184" width="222" height="115" rx="7" fill="#f9fbfd" stroke="#a3a3a3" stroke-width="2.6"/>
<rect x="162" y="173" width="70" height="23" rx="4" fill="#a3a3a3"/>
<text x="197.0" y="189" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">context</text>
<text x="37" y="208" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">INTENTION</text>
<text x="37" y="236" font-size="20" font-weight="700" fill="#182f46" text-anchor="start">Count incoming lines</text>
<text x="37" y="265" font-size="15" font-weight="400" fill="#192e42" text-anchor="start">Count a stream of text</text>
<text x="37" y="287" font-size="15" font-weight="400" fill="#192e42" text-anchor="start">without editing its contents.</text>
<rect x="25" y="386" width="222" height="115" rx="7" fill="#f9fbfd" stroke="#3b82f6" stroke-width="2.6"/>
<rect x="162" y="375" width="75" height="23" rx="4" fill="#3b82f6"/>
<text x="199.5" y="391" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">changed</text>
<text x="37" y="410" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">RULE</text>
<text x="37" y="438" font-size="20" font-weight="700" fill="#182f46" text-anchor="start">Input selection</text>
<text x="37" y="467" font-size="15" font-weight="400" fill="#586674" text-anchor="start">Today: every name is a file.</text>
<text x="37" y="489" font-size="15" font-weight="400" fill="#192e42" text-anchor="start">Proposed: “-” selects stdin.</text>
<rect x="274" y="386" width="222" height="115" rx="7" fill="#f9fbfd" stroke="#3b82f6" stroke-width="2.6"/>
<rect x="411" y="375" width="75" height="23" rx="4" fill="#3b82f6"/>
<text x="448.5" y="391" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">changed</text>
<text x="286" y="410" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">PARTICIPANT</text>
<text x="286" y="438" font-size="20" font-weight="700" fill="#182f46" text-anchor="start">Line counter CLI</text>
<text x="286" y="467" font-size="15" font-weight="400" fill="#586674" text-anchor="start">Today: owns file input.</text>
<text x="286" y="489" font-size="15" font-weight="400" fill="#192e42" text-anchor="start">Proposed: also accepts pipes.</text>
<rect x="523" y="184" width="222" height="115" rx="7" fill="#f9fbfd" stroke="#3b82f6" stroke-width="2.6"/>
<rect x="660" y="173" width="75" height="23" rx="4" fill="#3b82f6"/>
<text x="697.5" y="189" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">changed</text>
<text x="535" y="208" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">COMPONENT</text>
<text x="535" y="236" font-size="20" font-weight="700" fill="#182f46" text-anchor="start">Input router</text>
<text x="535" y="265" font-size="15" font-weight="400" fill="#586674" text-anchor="start">Today: opens the path.</text>
<text x="535" y="287" font-size="15" font-weight="400" fill="#192e42" text-anchor="start">Proposed: borrow stdin for “-”.</text>
<rect x="772" y="386" width="222" height="115" rx="7" fill="#f9fbfd" stroke="#3b82f6" stroke-width="2.6"/>
<rect x="909" y="375" width="75" height="23" rx="4" fill="#3b82f6"/>
<text x="946.5" y="391" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">changed</text>
<text x="784" y="410" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">INTERFACE</text>
<text x="784" y="438" font-size="20" font-weight="700" fill="#182f46" text-anchor="start">Argument INPUT</text>
<text x="784" y="467" font-size="15" font-weight="400" fill="#586674" text-anchor="start">Today: a file path.</text>
<text x="784" y="489" font-size="15" font-weight="400" fill="#192e42" text-anchor="start">Proposed: a path or “-”.</text>
<rect x="1021" y="184" width="222" height="115" rx="7" fill="#f9fbfd" stroke="#22a06b" stroke-width="2.6"/>
<rect x="1158" y="173" width="45" height="23" rx="4" fill="#22a06b"/>
<text x="1180.5" y="189" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">new</text>
<text x="1033" y="208" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">STATE ELEMENT</text>
<text x="1033" y="236" font-size="20" font-weight="700" fill="#182f46" text-anchor="start">Borrowed stdin</text>
<text x="1033" y="265" font-size="15" font-weight="400" fill="#192e42" text-anchor="start">Caller supplies this stream.</text>
<text x="1033" y="287" font-size="15" font-weight="400" fill="#192e42" text-anchor="start">Leave it open after counting.</text>
<rect x="1270" y="184" width="222" height="115" rx="7" fill="#f9fbfd" stroke="#22a06b" stroke-width="2.6"/>
<rect x="1407" y="173" width="45" height="23" rx="4" fill="#22a06b"/>
<text x="1429.5" y="189" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">new</text>
<text x="1282" y="208" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">TEST</text>
<text x="1282" y="236" font-size="20" font-weight="700" fill="#182f46" text-anchor="start">Stream ownership</text>
<text x="1282" y="265" font-size="15" font-weight="400" fill="#192e42" text-anchor="start">After a “-” call returns,</text>
<text x="1282" y="287" font-size="15" font-weight="400" fill="#192e42" text-anchor="start">assert stdin is still open.</text>
<rect x="1270" y="501" width="222" height="115" rx="7" fill="#f9fbfd" stroke="#a3a3a3" stroke-width="2.6"/>
<rect x="1407" y="490" width="70" height="23" rx="4" fill="#a3a3a3"/>
<text x="1442.0" y="506" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">context</text>
<text x="1282" y="525" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">TEST</text>
<text x="1282" y="553" font-size="20" font-weight="700" fill="#182f46" text-anchor="start">Named-file check</text>
<text x="1282" y="582" font-size="15" font-weight="400" fill="#192e42" text-anchor="start">Pass a path to a two-line file.</text>
<text x="1282" y="604" font-size="15" font-weight="400" fill="#192e42" text-anchor="start">Expect a count of two.</text>
<rect x="1270" y="344" width="222" height="115" rx="7" fill="#f9fbfd" stroke="#22a06b" stroke-width="2.6"/>
<rect x="1407" y="333" width="45" height="23" rx="4" fill="#22a06b"/>
<text x="1429.5" y="349" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">new</text>
<text x="1282" y="368" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">TEST</text>
<text x="1282" y="396" font-size="20" font-weight="700" fill="#182f46" text-anchor="start">Pipeline check</text>
<text x="1282" y="425" font-size="15" font-weight="400" fill="#192e42" text-anchor="start">Pipe two lines with “-”.</text>
<text x="1282" y="447" font-size="15" font-weight="400" fill="#192e42" text-anchor="start">Expect a count of two.</text>
<path d="M136 301 V382" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="149" y="347" font-size="14" font-weight="600" fill="#344d64" text-anchor="start">motivates</text>
<path d="M200 502 V522 H310 V506" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="255" y="545" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">applies to</text>
<path d="M385 386 V240 H519" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="440" y="229" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">delegates to</text>
<path d="M636 300 V358 H883 V382" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="748" y="347" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">interprets</text>
<path d="M745 240 H1017" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="878" y="230" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">selects for “-”</text>
<path d="M1132 299 V319 H1350 V303" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1223" y="315" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">checked by</text>
<path d="M994 422 H1266" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1128" y="412" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">exercised by</text>
<path d="M886 501 V559 H1266" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1128" y="549" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">still exercised by</text>
</svg>
