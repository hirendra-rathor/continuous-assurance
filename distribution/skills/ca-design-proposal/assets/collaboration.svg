<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" height="580" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
<title id="title">How the CLI chooses its input</title><desc id="desc">Teaching proposal. The shell supplies the input token and any piped text. The input router opens a file or borrows stdin, then supplies the selected stream to the line counter. Gray means context, blue means changed and green means new.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#435970"/></marker></defs>
<rect width="1040" height="580" fill="white"/>
<text x="28" y="43" font-size="29" font-weight="700" fill="#182f46" text-anchor="start">How the CLI chooses its input</text>
<rect x="815" y="20" width="70" height="23" rx="4" fill="#a3a3a3"/>
<text x="850.0" y="36" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">context</text>
<rect x="893" y="20" width="75" height="23" rx="4" fill="#3b82f6"/>
<text x="930.5" y="36" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">changed</text>
<rect x="976" y="20" width="45" height="23" rx="4" fill="#22a06b"/>
<text x="998.5" y="36" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">new</text>
<text x="28" y="75" font-size="17" font-weight="400" fill="#182f46" text-anchor="start">The router owns files it opens. The caller keeps ownership of standard input.</text>
<rect x="28" y="240" width="205" height="115" rx="7" fill="#f9fbfd" stroke="#a3a3a3" stroke-width="2.6"/>
<rect x="148" y="229" width="70" height="23" rx="4" fill="#a3a3a3"/>
<text x="183.0" y="245" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">context</text>
<text x="40" y="264" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">CALLER</text>
<text x="40" y="292" font-size="20" font-weight="700" fill="#182f46" text-anchor="start">Shell</text>
<text x="40" y="321" font-size="15" font-weight="400" fill="#192e42" text-anchor="start">Supplies the argument</text>
<text x="40" y="343" font-size="15" font-weight="400" fill="#192e42" text-anchor="start">and any piped text.</text>
<rect x="298" y="111" width="716" height="432" rx="10" fill="#f3f6f9" stroke="#95a6b5" stroke-dasharray="7 4"/>
<text x="313" y="138" font-size="13" font-weight="700" fill="#466078" text-anchor="start">LINE COUNTER PROCESS</text>
<rect x="324" y="239" width="248" height="115" rx="7" fill="#f9fbfd" stroke="#3b82f6" stroke-width="2.6"/>
<rect x="487" y="228" width="75" height="23" rx="4" fill="#3b82f6"/>
<text x="524.5" y="244" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">changed</text>
<text x="336" y="263" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">COMPONENT</text>
<text x="336" y="291" font-size="20" font-weight="700" fill="#182f46" text-anchor="start">Input router</text>
<text x="336" y="320" font-size="15" font-weight="400" fill="#586674" text-anchor="start">Today: always opens a file.</text>
<text x="336" y="342" font-size="15" font-weight="400" fill="#192e42" text-anchor="start">Proposed: borrow stdin for “-”.</text>
<rect x="706" y="161" width="272" height="115" rx="7" fill="#f9fbfd" stroke="#a3a3a3" stroke-width="2.6"/>
<rect x="893" y="150" width="70" height="23" rx="4" fill="#a3a3a3"/>
<text x="928.0" y="166" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">context</text>
<text x="718" y="185" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">RESOURCE</text>
<text x="718" y="213" font-size="20" font-weight="700" fill="#182f46" text-anchor="start">Named file</text>
<text x="718" y="242" font-size="15" font-weight="400" fill="#192e42" text-anchor="start">Open the requested path.</text>
<text x="718" y="264" font-size="15" font-weight="400" fill="#192e42" text-anchor="start">Close it after counting.</text>
<rect x="706" y="372" width="272" height="115" rx="7" fill="#f9fbfd" stroke="#22a06b" stroke-width="2.6"/>
<rect x="893" y="361" width="45" height="23" rx="4" fill="#22a06b"/>
<text x="915.5" y="377" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">new</text>
<text x="718" y="396" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">RESOURCE</text>
<text x="718" y="424" font-size="20" font-weight="700" fill="#182f46" text-anchor="start">Borrowed stdin</text>
<text x="718" y="453" font-size="15" font-weight="400" fill="#192e42" text-anchor="start">Read the caller’s stream.</text>
<text x="718" y="475" font-size="15" font-weight="400" fill="#192e42" text-anchor="start">Leave it open on return.</text>
<rect x="324" y="419" width="248" height="93" rx="7" fill="#f9fbfd" stroke="#a3a3a3" stroke-width="2.6"/>
<rect x="487" y="408" width="70" height="23" rx="4" fill="#a3a3a3"/>
<text x="522.0" y="424" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">context</text>
<text x="336" y="443" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">COMPONENT</text>
<text x="336" y="471" font-size="20" font-weight="700" fill="#182f46" text-anchor="start">Line counter</text>
<text x="336" y="500" font-size="15" font-weight="400" fill="#192e42" text-anchor="start">Counts lines in the stream.</text>
<path d="M233 300 H320" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="275" y="287" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">INPUT</text>
<path d="M572 271 H637 V219 H702" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="674" y="208" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">path</text>
<path d="M572 330 H637 V434 H702" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="670" y="424" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">“-”</text>
<path d="M448 355 V415" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="460" y="392" font-size="14" font-weight="600" fill="#344d64" text-anchor="start">supplies stream</text>
</svg>
